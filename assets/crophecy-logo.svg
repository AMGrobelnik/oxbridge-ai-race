<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" role="img" aria-label="Crophecy">
  <title>Crophecy</title>
  <!-- The mark: an eye (prophecy) whose upper lid is a crescent and whose pupil is a grain of wheat, three wheat awns rising
       from it. The wordmark is Instrument Serif, "Crop" upright in field ink and "hecy" italic in wheat ink. -->
  <g transform="translate(0 2)">
    <path d="M2.5 19C8 10.2 24 10.2 29.5 19C24 13.7 8 13.7 2.5 19Z" fill="#14190f"/>
    <path d="M2.5 19C8 26.2 24 26.2 29.5 19" fill="none" stroke="#14190f" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M16 14.2c3.4 1.6 3.4 8.6 0 10.2-3.4-1.6-3.4-8.6 0-10.2Z" fill="#c99a3b"/>
    <path d="M16 16.2v6.2" stroke="#f6f4ec" stroke-width=".85" stroke-linecap="round"/>
    <path d="M16 9.6V3.4M12.6 10.3 10.9 5M19.4 10.3 21.1 5" stroke="#c99a3b" stroke-width="1.15" stroke-linecap="round" fill="none"/>
  </g>
  <text x="38" y="27" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="27" fill="#14190f">Crop<tspan font-style="italic" fill="#8a6517">hecy</tspan></text>
</svg>
