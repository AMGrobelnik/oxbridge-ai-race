<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Bots</title>
<meta name="description" content="Bet 100 play credits against the AI swarm on heat, drought, wheat, olive oil, water and EU farm policy. No signup.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/frontend/assets/theme.css?v=1">
<style>
  :root {
    /* the waitlist look (frontend/assets/theme.css): mist and paper, soil ink, grain-ochre accent, serif display, mono labels */
    --bg: var(--mist); --panel: var(--paper); --panel2: var(--mist); --ink: var(--soil); --muted: var(--stalk); --faint: var(--stalk);
    --line: var(--hairline-strong); --line2: var(--hairline-strong); --accent: var(--wheat-ink); --accent2: var(--wheat-ink); --heat: var(--down);
    --yes: var(--up); --yes-bg: #dcebdf; --no: var(--down); --no-bg: #f4ddd7; --human: var(--wheat-ink); --bot: var(--soil-2);
    --mono: var(--f-mono); --sans: var(--f-body); --display: var(--f-display);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 28px; }
  .top { display: flex; align-items: center; gap: 8px; height: 54px; }
  .brand { margin-right: auto; font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .credits { font: 700 15px var(--mono); padding: 5px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line2); white-space: nowrap; }
  h1 { font: 400 32px/1.05 var(--display); letter-spacing: -.03em; margin: 6px 0 6px; }
  h1 em { font-style: italic; color: var(--wheat-ink); }
  .me { color: var(--muted); margin: 0 0 14px; font-size: 14.5px; }
  .me b { color: var(--ink); font-family: var(--mono); font-size: 14px; }
  .events { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-lift); border-radius: 16px; padding: 14px; }
  .card.featured { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .badge { float: right; font: 700 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--bg); background: var(--accent); padding: 3px 7px; border-radius: 999px; }
  .odds { display: flex; align-items: baseline; gap: 14px; margin: 2px 0 10px; }
  .odds .crowd { font: 400 30px/1 var(--display); letter-spacing: -.02em; color: var(--yes); font-variant-numeric: tabular-nums; }
  .odds .crowd small, .odds .ai small { display: block; font: 500 11px var(--mono); color: var(--muted); letter-spacing: .03em; margin-top: 3px; }
  .odds .ai { font: 400 18px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .card .bet { padding: 11px 6px; border-radius: 12px; font-size: 18px; }
  .card .bet small { font-size: 11.5px; margin-top: 2px; }
  .vs { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line2); font-size: 13.5px; }
  .vs[hidden] { display: none; }
  .vs .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .vs .row b { font-family: var(--mono); font-size: 13px; }
  .vs h4 { margin: 0 0 4px; font: 400 13px var(--display); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
  .vs a { display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .card .msg { min-height: 0; margin: 8px 0 0; font-size: 13.5px; }
  .card .msg:empty { display: none; }
  .qmeta { font: 500 11.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .qtitle { font: 400 21px/1.2 var(--display); margin: 6px 0 8px; }
  .prob { display: flex; align-items: baseline; gap: 8px; }
  .prob .big { font: 400 44px/1 var(--display); letter-spacing: -.03em; color: var(--yes); font-variant-numeric: tabular-nums; }
  .prob .lbl { color: var(--muted); font-weight: 600; }
  .spark { height: 48px; margin: 0 0 10px; }
  .spark svg { width: 100%; height: 100%; display: block; }
  .stake { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 0 10px; display: flex; align-items: center; gap: 10px; }
  .stake span { font: 600 12px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .amounts { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .amounts button { padding: 8px 0; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel); color: var(--ink); font: 700 16px var(--mono); }
  .amounts button[aria-pressed="true"] { border-color: var(--accent); background: var(--panel2); box-shadow: inset 0 0 0 1px var(--accent); }
  .bets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bet { padding: 18px 8px; border-radius: 14px; border: 0; font: 400 24px/1.1 var(--display); color: #fff; }
  .bet small { display: block; font: 600 13px var(--mono); opacity: .9; margin-top: 4px; }
  .bet.YES { background: var(--yes); } .bet.NO { background: var(--no); }
  .bet:disabled { opacity: .45; }
  .bet:active { transform: scale(.98); }
  .msg { min-height: 24px; margin: 12px 0 0; font-size: 14.5px; color: var(--muted); }
  .msg.ok { color: var(--yes); } .msg.err { color: var(--no); }
  h2 { font: 400 16px var(--display); margin: 22px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
  li .who { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.mine { border-color: var(--accent); }
  .pill { font: 700 12px var(--mono); padding: 2px 8px; border-radius: 999px; }
  .pill.YES { color: var(--yes); background: var(--yes-bg); } .pill.NO { color: var(--no); background: var(--no-bg); }
  .foot { margin-top: 22px; color: var(--faint); font-size: 12.5px; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="brand">The Crophecy</span><span class="credits" id="credits">100 credits</span></div>
  <h1>Can you <em>beat the bots?</em></h1>
  <p class="me" id="me">Getting you a guest handle…</p>

  <div class="stake"><span>Stake</span>
    <div class="amounts" id="amounts" role="group" aria-label="Credits per bet">
      <button type="button" data-v="5">5</button><button type="button" data-v="10" aria-pressed="true">10</button>
      <button type="button" data-v="25">25</button><button type="button" data-v="50">50</button>
    </div>
  </div>
  <section class="events" id="events"><div class="card"><div class="qtitle">Loading the live events…</div></div></section>
  <p class="msg" id="msg" role="status"></p>

  <h2>Latest bets: 👤 humans vs 🤖 bots</h2>
  <ul id="feed"></ul>

  <p class="foot">Play credits only, no money and no signup. Your bets are on the big screen and in the public hash-chained ledger. Want more markets? <a href="/harvest/play">Open the full game</a>.</p>
</main>
<script src="/harvest/static/vote.js"></script>
</body>
</html>
